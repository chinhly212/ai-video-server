<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Server - Test</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f2f4f7;color:#172033}
header{padding:16px;background:#18283f;color:white;font-weight:700}
main{max-width:760px;margin:auto;padding:16px}.panel{background:white;border-radius:12px;padding:14px;margin:12px 0}
input{width:100%;padding:13px;border:1px solid #ccd3dd;border-radius:9px;font-size:15px}
button{padding:12px 18px;border:0;border-radius:9px;background:#1769d2;color:white;font-weight:700;margin-top:10px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101820;color:#d9f5e5;padding:12px;border-radius:9px}
small{color:#64748b}
</style></head>
<body><header>AI Video Server · Kiểm tra API</header>
<main>
<div class="panel"><b>Trạng thái máy chủ</b><pre id="health">Đang kiểm tra...</pre></div>
<div class="panel"><b>Chat hoặc tải video</b><p><small>Dán câu hỏi hoặc đường dẫn video công khai mà bạn có quyền tải.</small></p>
<input id="message" placeholder="Nhập câu hỏi hoặc dán link video">
<button id="send">Gửi yêu cầu</button><pre id="result">Chưa có yêu cầu.</pre></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function checkHealth(){try{const r=await fetch('/');$('health').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('health').textContent='Không kết nối được: '+e.message}}
$('send').addEventListener('click',async()=>{
 const message=$('message').value.trim();if(!message){$('result').textContent='Vui lòng nhập nội dung.';return}
 $('send').disabled=true;$('result').textContent='Đang xử lý...';
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
 const data=await r.json();$('result').textContent=JSON.stringify(data,null,2)}
 catch(e){$('result').textContent='Lỗi kết nối: '+e.message}
 finally{$('send').disabled=false}
});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
checkHealth();
</script></body></html>
